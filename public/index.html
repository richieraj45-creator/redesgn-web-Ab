                var p = window.location.pathname;
                if (p === "/" || p === "/index.html") {
                    if ("scrollRestoration" in window.history) window.history.scrollRestoration = "manual";
                    window.scrollTo(0, 0);
                    window.__STOREFRONT__ = true;
                    var t = document.getElementById("storefront-template");
                    document.body.innerHTML = "";
                    document.body.appendChild(t.content.cloneNode(true));
                    document.body.classList.add("storefront");
                    var l = document.createElement("link");
                    l.rel = "stylesheet";
                    l.href = "%PUBLIC_URL%/storefront.css";
                    document.head.appendChild(l);
                    var s = document.createElement("script");
                    s.src = "%PUBLIC_URL%/storefront.js";
                    var releaseSplash = function () {
                        if (window.__STOREFRONT_INTRO_MANAGED__) return;
                        var splash = document.getElementById("splash");
                        if (!splash) return;
                        splash.classList.add("done");
                        document.body.classList.remove("lock");
                        window.setTimeout(function () {
                            if (splash.parentNode) splash.parentNode.removeChild(splash);
                        }, 600);
                    };
                    s.onerror = releaseSplash;
                    document.body.appendChild(s);
                    window.setTimeout(releaseSplash, 5500);
                }
            })();
        </script>
    </body>
</html>
